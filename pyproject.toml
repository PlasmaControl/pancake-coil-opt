[build-system]
requires = ["uv_build>=0.9.3,<0.10"]
build-backend = "uv_build"

[project]
name = "pancakecoilopt"
version = "0.1.0"
description = "A Python package to optimize HTS pancake coils."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.3",
    "numpy==2.2.4",
    "scipy==1.15.2",
    "jax==0.6.0",
    "jaxellip==0.0.1",
    "ruamel.yaml==0.18.10",
    "matplotlib==3.10.1",
]

[tool.uv.build-backend]
module-name = "pancakecoilopt"
module-root = ""

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
addopts = ["-ra", "-v"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
