[build-system]
requires = ["uv_build>=0.9.3,<0.10"]
build-backend = "uv_build"

[project]
name = "pancakecoilopt"
version = "0.1.0"
description = "A Python package to optimize HTS CC pancake coils (rebuilt from scratch)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.3",
    "numpy==2.2.4",
    "scipy==1.15.2",
    "jax==0.6.0",
    "jaxellip==0.0.1",
]
classifiers = ["Intended Audience :: Science/Research"]

# Flat layout: the importable package lives at the repository root rather than
# under src/, so point the uv build backend there.
[tool.uv.build-backend]
module-name = "pancakecoilopt"
module-root = ""

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
addopts = ["-ra", "-v"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
